name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # CommandLineTools alone cannot expand SwiftUI's @State / @Observable
      # macros — the SwiftUIMacros plugin ships only with full Xcode. The
      # image's default Xcode lags behind (Xcode 16, Swift 6.1 on macos-15),
      # and the app needs the macOS 26 SDK, so take the newest Xcode the
      # image has rather than pinning one a future image may not carry.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package app
        run: ./Scripts/package_app.sh

      - name: Verify bundle
        run: |
          test -x QuotaBar.app/Contents/MacOS/QuotaBar
          test -f QuotaBar.app/Contents/Resources/AppIcon.icns
          test -d QuotaBar.app/Contents/Resources/logos
          codesign --verify --verbose QuotaBar.app

      # Smoke test: the panel is a menu-bar popover with no window to drive in
      # CI, so render it off-screen instead. A view that traps on layout fails
      # here rather than the first time a user clicks the icon.
      - name: Render UI snapshots
        run: |
          QuotaBar.app/Contents/MacOS/QuotaBar --snapshot "$PWD/snapshots"
          test "$(ls snapshots/*.png | wc -l)" -ge 12
          QuotaBar.app/Contents/MacOS/QuotaBar --settings-preview "$PWD/snapshots/settings"
          test "$(ls snapshots/settings/*.png | wc -l)" -ge 28

      - uses: actions/upload-artifact@v7
        with:
          name: ui-snapshots
          path: snapshots/
